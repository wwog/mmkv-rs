[workspace]
members = [
    "crates/mmkv-rs",
    "crates/mmkv-core",
    "crates/mmkv-platform",
    "crates/mmkv-platform-posix",
    "crates/mmkv-platform-macos",
    "crates/mmkv-platform-ios",
    "crates/mmkv-platform-linux",
    "crates/mmkv-platform-android",
    "crates/mmkv-platform-windows",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
authors = ["wwog"]
repository = "https://github.com/wwog/mmkv-rs"
keywords = ["mmkv", "key-value", "storage", "encryption", "database"]
categories = ["database", "database-implementations", "caching", "filesystem"]

[workspace.dependencies]
mmkv-platform = { version = "0.1.0", path = "crates/mmkv-platform" }
mmkv-platform-posix = { version = "0.1.0", path = "crates/mmkv-platform-posix" }
mmkv-platform-macos = { version = "0.1.0", path = "crates/mmkv-platform-macos" }
mmkv-platform-ios = { version = "0.1.0", path = "crates/mmkv-platform-ios" }
mmkv-platform-linux = { version = "0.1.0", path = "crates/mmkv-platform-linux" }
mmkv-platform-android = { version = "0.1.0", path = "crates/mmkv-platform-android" }
mmkv-platform-windows = { version = "0.1.0", path = "crates/mmkv-platform-windows" }
mmkv-core = { version = "0.1.0", path = "crates/mmkv-core" }

libc = "0.2"
memmap2 = "0.9"
parking_lot = "0.13"
md-5 = "0.11"
aes = "0.9"
getrandom = "0.4"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2"] }
block2 = "0.6"
jni = "0.22"
tempfile = "3"

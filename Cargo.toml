[workspace]
members = [
    "crates/mmkv-rs",
    "crates/mmkv-core",
    "crates/mmkv-platform",
    "crates/mmkv-platform-posix",
    "crates/mmkv-platform-macos",
    "crates/mmkv-platform-ios",
    "crates/mmkv-platform-linux",
    "crates/mmkv-platform-android",
    "crates/mmkv-platform-windows",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[workspace.dependencies]
mmkv-platform = { path = "crates/mmkv-platform" }
mmkv-platform-posix = { path = "crates/mmkv-platform-posix" }
mmkv-platform-macos = { path = "crates/mmkv-platform-macos" }
mmkv-platform-ios = { path = "crates/mmkv-platform-ios" }
mmkv-platform-linux = { path = "crates/mmkv-platform-linux" }
mmkv-platform-android = { path = "crates/mmkv-platform-android" }
mmkv-platform-windows = { path = "crates/mmkv-platform-windows" }
mmkv-core = { path = "crates/mmkv-core" }

libc = "0.2"
memmap2 = "0.9"
parking_lot = "0.12"
md-5 = "0.10"
aes = "0.8"
getrandom = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2"] }
block2 = "0.6"
jni = "0.21"
tempfile = "3"

[package]
name = "mmkv-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "macOS, tvOS, watchOS and visionOS support for the MMKV Rust port, using objc2 Foundation."

[dependencies]
mmkv-platform.workspace = true

# Keep the workspace buildable on non-Apple hosts: objc2 itself rejects
# non-Apple targets at compile time, so it must not be an unconditional
# dependency of a workspace member.
[target.'cfg(target_vendor = "apple")'.dependencies]
mmkv-platform-posix.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true

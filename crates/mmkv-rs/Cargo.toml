[package]
name = "mmkv-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "A byte-compatible Rust port of Tencent MMKV: fast memory-mapped key-value storage with AES-CFB128 encryption and key expiration."

[dependencies]
mmkv-core.workspace = true
mmkv-platform.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
mmkv-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
mmkv-platform-ios.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mmkv-platform-linux.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
mmkv-platform-android.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mmkv-platform-windows.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "tvos", target_os = "watchos", target_os = "visionos", target_os = "ios", target_os = "linux", target_os = "android", target_os = "windows")))'.dependencies]
mmkv-platform-posix.workspace = true

[dev-dependencies]
tempfile.workspace = true

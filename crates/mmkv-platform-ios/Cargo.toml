[package]
name = "mmkv-platform-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "iOS support for the MMKV Rust port: App Group paths, file protection and background/memory-warning lifecycle."

[dependencies]
mmkv-platform.workspace = true

# See mmkv-platform-macos: objc2 only compiles on Apple targets, so the
# workspace must stay buildable elsewhere.
[target.'cfg(target_os = "ios")'.dependencies]
mmkv-platform-posix.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
block2.workspace = true
